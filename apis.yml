name: Stateless
description: Stateless was a Boulder, Colorado network-infrastructure startup (founded 2016) that
  built a software platform for network automation in the hybrid multi-cloud era, delivering network
  functions such as firewalls and load balancers through an "as a service" consumption model with an
  emphasis on simplicity, scalability, and evolvability. Backed by Speedinvest, the National Science
  Foundation, Drive Capital, and Matchstick Ventures, with its last funding announced in December 2022.
  The company now appears defunct — its former domains (stateless.net, getstateless.com) redirect to
  domain-parking "for sale" pages and no live developer portal, documentation, or API surface remains.
